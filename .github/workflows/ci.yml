name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pinned pnpm version from the packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Only needed if a native module (usb, serialport) has no prebuilt binary
      # for the runner and falls back to node-gyp.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - run: pnpm install --frozen-lockfile

      # Build first: the daemon and CLI resolve `cellary` (and the CLI resolves
      # `@cellary/daemon`) through package exports that point at dist/, so
      # typecheck and tests need the workspace dependencies built.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm audit --audit-level high
